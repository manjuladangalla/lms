[project]
name = "lms-api"
version = "0.1.0"
description = "LMS FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "motor==3.6.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "email-validator==2.2.0",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.2.1",
    "python-multipart==0.0.20",
    "redis==5.2.1",
    "httpx==0.28.1",
    "boto3==1.35.86",
    "qrcode==8.0",
    "Pillow==11.1.0",
    "reportlab==4.2.5",
    "python-slugify==8.0.4",
]

[dependency-groups]
dev = []

[tool.uv]
package = false
