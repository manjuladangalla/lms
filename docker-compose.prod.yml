# Production stack (DigitalOcean droplet / any Linux host)
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Differences from docker-compose.yml (dev):
#   * only Caddy is published (80/443); mongo, redis, api and web are internal
#   * Caddy terminates HTTPS - set DOMAIN=yourdomain.com in .env for a real
#     Let's Encrypt certificate; without it the site still works over HTTPS on the
#     droplet IP with a self-signed certificate
#   * the frontend is built with the relative API url /api/v1 (same origin)
#   * DEBUG defaults to false; .env is optional

name: lms-prod

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: ${MONGO_DB:-lms}
      REDIS_URL: redis://redis:6379/0
      DEBUG: ${DEBUG:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api/v1
    restart: unless-stopped
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

volumes:
  mongo_data:
  uploads_data:
  caddy_data:
  caddy_config:
